[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-agent"
version = "0.3.0"
description = "OpsPilot OpenAI incident investigation agent"
requires-python = ">=3.11"
dependencies = [
    "openai-agents==0.22.0",
    "pydantic>=2.12.2,<3",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
opspilot-agent = "opspilot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
