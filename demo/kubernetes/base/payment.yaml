apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: opspilot-demo
  labels:
    app: payment
  annotations:
    opspilot.dev/repository: "opspilot-demo/opspilot-demo-services"
    opspilot.dev/revision: "1111111111111111111111111111111111111111"
    opspilot.dev/previous-revision: "1111111111111111111111111111111111111111"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: opspilot/payment:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "postgres://demo-user:demo-password@postgres.demo:5432/payments"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: opspilot-demo
spec:
  selector:
    app: payment
  ports:
    - name: http
      port: 8080
      targetPort: http
