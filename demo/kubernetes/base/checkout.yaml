apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: opspilot-demo
  labels:
    app: checkout
  annotations:
    opspilot.dev/repository: "opspilot-demo/opspilot-demo-services"
    opspilot.dev/revision: "1111111111111111111111111111111111111111"
    opspilot.dev/previous-revision: "1111111111111111111111111111111111111111"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: opspilot/checkout:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: INVENTORY_URL
              value: "http://inventory:8080/inventory"
            - name: INVENTORY_TIMEOUT_MS
              value: "500"
            - name: MEMORY_HOG_MB
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: opspilot-demo
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 8080
      targetPort: http
