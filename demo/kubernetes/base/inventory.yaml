apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: opspilot-demo
  labels:
    app: inventory
  annotations:
    opspilot.dev/repository: "opspilot-demo/opspilot-demo-services"
    opspilot.dev/revision: "1111111111111111111111111111111111111111"
    opspilot.dev/previous-revision: "1111111111111111111111111111111111111111"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: opspilot/inventory:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RESPONSE_DELAY_MS
              value: "100"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: opspilot-demo
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 8080
      targetPort: http
