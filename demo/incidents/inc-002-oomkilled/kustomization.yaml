apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes/base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: checkout
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "192"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 64Mi

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: checkout
    patch: |-
      - op: replace
        path: /metadata/annotations/opspilot.dev~1revision
        value: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
