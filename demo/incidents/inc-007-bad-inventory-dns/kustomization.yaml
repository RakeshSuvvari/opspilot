apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes/base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: checkout
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "http://inventory-v2:8080/inventory"
      - op: replace
        path: /metadata/annotations/opspilot.dev~1revision
        value: "7777777777777777777777777777777777777777"
