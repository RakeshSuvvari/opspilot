apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes/base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: payment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "9090"
      - op: replace
        path: /metadata/annotations/opspilot.dev~1revision
        value: "9999999999999999999999999999999999999999"
