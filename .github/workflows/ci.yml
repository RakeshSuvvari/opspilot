name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Test Go modules
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            demo/services/checkout
            demo/services/payment
            demo/services/inventory
            services/k8s-mcp-server
            services/github-mcp-server
            services/incident-api
          )
          for module in "${modules[@]}"; do
            echo "==> go test ${module}"
            (cd "$module" && GOWORK=off go test ./...)
          done

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/agent/pyproject.toml

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/agent

      - name: Run unit tests
        env:
          PYTHONPATH: services/agent/src
        run: python -m unittest discover -s services/agent/tests -v

  dashboard:
    name: TypeScript dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Validate Kustomize manifests
        run: ./scripts/validate-manifests.sh
