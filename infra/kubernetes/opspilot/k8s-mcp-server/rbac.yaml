apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opspilot-k8s-reader
  namespace: opspilot-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opspilot-k8s-reader
  namespace: opspilot-demo
subjects:
  - kind: ServiceAccount
    name: k8s-mcp-server
    namespace: opspilot-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opspilot-k8s-reader
