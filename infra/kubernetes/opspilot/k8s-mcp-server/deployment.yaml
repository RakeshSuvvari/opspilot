apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: opspilot-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
    spec:
      serviceAccountName: k8s-mcp-server
      containers:
        - name: k8s-mcp-server
          image: opspilot/k8s-mcp-server:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: OPSPILOT_MCP_ADDR
              value: ":8080"
            - name: OPSPILOT_DEFAULT_NAMESPACE
              value: opspilot-demo
            - name: OPSPILOT_K8S_WRITE_ENABLED
              value: "false"
            - name: OPSPILOT_K8S_MAX_SCALE_REPLICAS
              value: "10"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
